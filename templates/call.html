<!DOCTYPE html>
<html lang="{{ ui_language }}" data-ai-brand-line="{{ ui_t('ai_brand_line', brand=saki_brand) }}">
<head>
  {% include "ui_language_head.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>语音通话</title>
  <script src="/static/auth-guard.js"></script>
  <link rel="stylesheet" href="/static/ai-disclosure.css">
  <style>
    :root { color-scheme: dark; --accent:#ff8faa; --glass:rgba(255,255,255,.09); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; background:#11151d; color:#fff; }
    .call-page { position:relative; width:100%; height:100vh; height:100dvh; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    .call-bg { position:absolute; inset:-30px; background:radial-gradient(circle at 50% 18%,rgba(255,143,170,.32),transparent 37%),linear-gradient(160deg,#252b3a,#11151d 58%,#090b10); filter:saturate(.9); }
    .call-bg::after { content:""; position:absolute; inset:0; backdrop-filter:blur(20px); background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.48)); }
    .call-content { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 22px) 18px 0; }
    .top { text-align:center; flex-shrink:0; }
    .avatar { width:92px; height:92px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,.55); box-shadow:0 14px 40px rgba(0,0,0,.35); background:#343947; }
    .name { margin-top:13px; font-size:24px; font-weight:650; letter-spacing:.02em; }
    .status { margin-top:6px; min-height:21px; color:rgba(255,255,255,.68); font-size:14px; }
    .duration { margin-top:3px; color:rgba(255,255,255,.48); font-size:12px; }
    .transcript { flex:1; min-height:0; overflow:auto; margin:22px auto 0; width:min(720px,100%); padding:4px 2px; scrollbar-width:none; }
    .transcript::-webkit-scrollbar { display:none; }
    .turn { max-width:88%; margin:10px 0; padding:10px 13px; border-radius:16px; background:var(--glass); backdrop-filter:blur(12px); line-height:1.5; font-size:15px; word-break:break-word; }
    .turn.user { margin-left:auto; background:rgba(255,143,170,.22); border-bottom-right-radius:5px; }
    .turn.assistant { margin-right:auto; border-bottom-left-radius:5px; }
    .turn-role { display:block; margin-bottom:3px; color:rgba(255,255,255,.46); font-size:11px; }
    .turn-tone { display:block; margin-top:5px; color:rgba(255,255,255,.42); font-size:11px; }
    .turn-tools { display:flex; justify-content:flex-end; margin-top:5px; }
    .translate-turn { border:0; border-radius:11px; padding:2px 8px; color:rgba(255,255,255,.68); background:rgba(255,255,255,.1); font-size:11px; }
    .turn-tools .translate-turn { position:relative; padding:2px 6px; line-height:1.25; cursor:pointer; }
    .turn-tools .translate-turn::after { content:""; position:absolute; inset:-5px -8px; }
    .turn-translation { display:block; margin-top:7px; padding-top:7px; border-top:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.74); font-size:13px; line-height:1.5; }
    .turn-translation[hidden] { display:none; }
    .bottom { position:relative; display:flex; flex-direction:column; flex:none; max-height:50%; padding:10px 18px max(var(--control-clearance,16px),calc(12px + env(safe-area-inset-bottom,0px))); background:linear-gradient(to bottom,transparent,rgba(7,9,13,.82) 35%,#07090d); }
    .call-feedback { min-height:0; overflow-y:auto; }
    #activeActions, #incomingActions { flex:none; }
    .live-text { width:min(680px,100%); max-height:4.35em; overflow:auto; overflow-wrap:anywhere; margin:0 auto 8px; text-align:center; color:rgba(255,255,255,.92); font-size:16px; line-height:1.45; text-shadow:0 1px 8px rgba(0,0,0,.45); }
    .live-text:empty { display:none; }
    .actions { display:flex; align-items:center; justify-content:center; gap:24px; }
    .action { width:62px; height:62px; border:0; border-radius:50%; color:#fff; background:rgba(255,255,255,.16); backdrop-filter:blur(12px); font-size:24px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.22); }
    .action:active { transform:scale(.95); }
    .action.accept { background:#36c878; }
    .action.reject,.action.hangup { background:#ef5261; }
    .action.muted { background:#fff; color:#222; }
    .action-labels { display:flex; justify-content:center; gap:24px; margin-top:7px; }
    .action-labels span { width:62px; text-align:center; color:rgba(255,255,255,.62); font-size:11px; }
    .hidden { display:none !important; }
    .back-btn { position:absolute; top:calc(env(safe-area-inset-top) + 14px); left:14px; z-index:3; border:0; color:#fff; background:rgba(0,0,0,.24); border-radius:20px; padding:8px 12px; font-size:13px; }
    .play-gate { display:none; margin:0 auto 13px; border:1px solid rgba(255,255,255,.3); color:#fff; background:rgba(255,255,255,.12); border-radius:18px; padding:8px 15px; }
    @media (min-width:700px) { .avatar{width:110px;height:110px}.call-content{padding-top:42px}.transcript{margin-top:28px}.turn{font-size:16px} }
    /* Some mobile shells draw navigation over the page without reporting an inset. */
    @media (pointer:coarse) and (orientation:portrait) { .bottom { --control-clearance:64px; } }
    @media (max-height:540px) {
      .call-content { padding-top:calc(6px + env(safe-area-inset-top)); }
      .avatar { width:40px; height:40px; }
      .name { margin-top:2px; font-size:17px; }
      .status { margin-top:2px; }
      .transcript { margin-top:4px; }
      .bottom { padding-top:4px; }
      .live-text { max-height:2.9em; }
      .action { width:48px; height:48px; }
      .action-labels span { width:48px; }
    }
  </style>
</head>
<body>
<main class="call-page">
  <div class="call-bg"></div>
  <button id="backBtn" class="back-btn hidden">返回聊天</button>
  <section class="call-content">
    <div class="top">
      <img id="avatar" class="avatar" src="/static/avatar_assistant.png" alt="角色头像">
      <div id="name" class="name">语音通话</div>
      <div id="status" class="status">正在连接…</div>
      <div id="duration" class="duration"></div>
    </div>
    <div id="transcript" class="transcript" aria-live="polite"></div>
  </section>
  <section class="bottom">
    <div class="ai-disclosure ai-disclosure--call" role="note" aria-label="AI 内容标识">
      <span>内容由 AI 生成</span>
    </div>
    <div class="call-feedback">
      <button id="playGate" class="play-gate">点击播放角色语音</button>
      <div id="liveText" class="live-text"></div>
      <div style="text-align:center;margin-bottom:12px">
        <button id="sendSpeechBtn" class="translate-turn hidden" type="button">发送</button>
        <button id="retrySpeechBtn" class="translate-turn hidden" type="button">重试</button>
      </div>
    </div>
    <div id="incomingActions" class="hidden">
      <div class="actions">
        <button id="rejectBtn" class="action reject" aria-label="拒绝">✕</button>
        <button id="acceptBtn" class="action accept" aria-label="接听">☎</button>
      </div>
      <div class="action-labels"><span>拒绝</span><span>接听</span></div>
    </div>
    <div id="activeActions" class="hidden">
      <div class="actions">
        <button id="muteBtn" class="action" aria-label="静音">🎙</button>
        <button id="hangupBtn" class="action hangup" aria-label="挂断">☎</button>
      </div>
      <div class="action-labels"><span id="muteLabel">静音</span><span>挂断</span></div>
    </div>
  </section>
</main>
<script src="/static/call-vad.js?v=20261030c"></script>
<script src="/static/call-speech.js?v=20261101a"></script>
<script>
(() => {
  const callId = {{ call_id|tojson }};
  const callPage = document.querySelector('.call-page');
  function fitVisibleViewport() {
    const height = window.visualViewport?.height || window.innerHeight;
    if (height > 0) callPage.style.maxHeight = Math.floor(height) + 'px';
  }
  fitVisibleViewport();
  window.addEventListener('resize', fitVisibleViewport);
  window.visualViewport?.addEventListener('resize', fitVisibleViewport);
  // Existing installed PWAs should pick up the recording-upload worker fix too.
  navigator.serviceWorker?.getRegistration().then(registration => registration?.update()).catch(() => {});
  const $ = id => document.getElementById(id);
  const statusEl = $('status'), durationEl = $('duration'), transcriptEl = $('transcript');
  const liveTextEl = $('liveText'), incomingActions = $('incomingActions'), activeActions = $('activeActions');
  let call = null, listening = null, muted = false, busy = false, durationTimer = null, heartbeatTimer = null;
  let ttsEnabled = true;
  let deferredPlayback = null, activeAudio = null;
  let ending = false, pendingTurn = null, responseAbort = null;
  const sendSpeechBtn = $('sendSpeechBtn'), retrySpeechBtn = $('retrySpeechBtn');

  async function api(path, options = {}) {
    const headers = Object.assign({'X-Requested-With':'XMLHttpRequest'}, options.headers || {});
    if (options.body && typeof options.body === 'string') headers['Content-Type'] = 'application/json';
    const response = await fetch(path, Object.assign({}, options, {headers, cache:'no-store'}));
    const type = response.headers.get('content-type') || '';
    const data = type.includes('application/json') ? await response.json().catch(() => ({})) : response;
    if (!response.ok) {
      const error = new Error(data.error || `请求失败（${response.status}）`);
      error.code = data.code; error.data = data; throw error;
    }
    return data;
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60), s = seconds % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function startDuration() {
    clearInterval(durationTimer);
    const base = call.answered_at ? Date.parse(call.answered_at) : Date.now();
    const tick = () => durationEl.textContent = formatDuration(Math.max(0, Math.floor((Date.now()-base)/1000)));
    tick(); durationTimer = setInterval(tick, 1000);
  }
  function addTurn(turn) {
    if (!turn || !turn.content) return;
    if (turn.id && transcriptEl.querySelector(`[data-turn-id="${turn.id}"]`)) return;
    const node = document.createElement('div');
    node.className = `turn ${turn.role}`;
    if (turn.id) node.dataset.turnId = turn.id;
    const role = document.createElement('span'); role.className='turn-role';
    role.textContent = turn.role === 'user' ? SakiI18n.t('你') : (call.character?.remark || call.character?.name || SakiI18n.t('角色'));
    const text = document.createElement('span'); text.className='turn-text'; text.textContent = turn.content; text.dataset.rawContent = turn.content; if (turn.role !== 'user') text.setAttribute('data-model-output','');
    node.append(role, text);
    if (turn.tone) { const tone=document.createElement('span'); tone.className='turn-tone'; tone.textContent=SakiI18n.ui`语气：${turn.tone}`; node.appendChild(tone); }
    if(turn.role==='assistant'){
      const tools=document.createElement('div');tools.className='turn-tools';
      const translate=document.createElement('button');translate.type='button';translate.className='translate-turn';translate.textContent=SakiI18n.t('译');translate.title=SakiI18n.t('翻译为用户语言');
      translate.onclick=()=>translateTurn(node,turn,translate);tools.appendChild(translate);node.appendChild(tools);
    }
    transcriptEl.appendChild(node); transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }
  function renderTurns(turns) { transcriptEl.innerHTML=''; (turns || []).forEach(addTurn); }
  function revealTranslation(button, translation) {
    const viewport = transcriptEl.getBoundingClientRect();
    const trigger = button.getBoundingClientRect();
    if (trigger.bottom <= viewport.top || trigger.top >= viewport.bottom) return;
    const overflow = translation.getBoundingClientRect().bottom - viewport.bottom;
    // Reveal as much of the result as fits below the button the user tapped.
    transcriptEl.scrollTop += Math.max(0, Math.min(overflow, trigger.top - viewport.top));
  }
  async function translateTurn(node,turn,button) {
    let translation=node.querySelector('.turn-translation');
    if(translation?.dataset.loaded==='true'){
      translation.hidden=!translation.hidden;
      button.textContent=translation.hidden?SakiI18n.t('译'):SakiI18n.t('收起');
      if(!translation.hidden)revealTranslation(button,translation);
      return;
    }
    if(!translation){translation=document.createElement('span');translation.className='turn-translation';node.appendChild(translation)}
    translation.hidden=false;translation.textContent=SakiI18n.t('正在翻译…');button.disabled=true;
    const context=Array.from(transcriptEl.querySelectorAll('.turn')).filter(item=>item!==node).slice(-5).map(item=>item.querySelector('.turn-text')?.dataset.rawContent||'').filter(Boolean).join('\n');
    const source=String(call.character?.language||'ja').toLowerCase();
    try{
      const response=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({text:turn.content,context,purpose:'read',char_id:call.char_id})});
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.result)throw new Error(data.error||'翻译失败');
      translation.textContent=data.result;translation.dataset.loaded='true';button.textContent=SakiI18n.t('收起');
    }catch(error){translation.textContent=error.message||SakiI18n.t('翻译失败');button.textContent=SakiI18n.t('重试')}
    finally{button.disabled=false;revealTranslation(button,translation)}
  }
  function showEnded(reason) {
    ending = true; stopListening(); responseAbort?.abort(); activeAudio?.finish(); pendingTurn = null; clearInterval(durationTimer); clearInterval(heartbeatTimer);
    incomingActions.classList.add('hidden'); activeActions.classList.add('hidden');
    $('backBtn').classList.remove('hidden'); liveTextEl.textContent='';
    const labels={rejected:SakiI18n.t('对方已拒绝'),missed:SakiI18n.t('未接听'),canceled:SakiI18n.t('已取消'),hangup:SakiI18n.t('通话已结束'),character_hangup:SakiI18n.t('对方已挂断'),disconnected:SakiI18n.t('连接已断开'),failed:SakiI18n.t('通话失败')};
    statusEl.textContent = labels[reason] || SakiI18n.t('通话已结束');
  }
  function showActive() {
    incomingActions.classList.add('hidden');
    activeActions.classList.remove('hidden');
    statusEl.textContent = ttsEnabled ? SakiI18n.t('正在通话') : SakiI18n.t('语音输入 · 文字回复'); startDuration();
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(() => api(`/api/calls/${callId}/heartbeat`,{method:'POST'}).catch(()=>{}),10000);
  }

  function stopListening() {
    const input = listening; listening = null;
    input?.close();
    sendSpeechBtn.classList.add('hidden');
    retrySpeechBtn.classList.add('hidden');
  }
  function canListen() { return call?.status === 'active' && !ending && !muted && !busy && !pendingTurn; }
  async function startListening() {
    if (!canListen()) return;
    if (!listening) {
      const input = new SakiCallSpeech.CallSpeechInput({
        workletUrl: '/static/call-audio-worklet.js?v=20261030c',
        vadUrl: '/static/call-vad-worker.js?v=20261030c',
        fetchToken: signal => api(`/api/calls/${callId}/stt-token`, {method:'POST', signal}),
        transcribe: (blob, signal, progress) => SakiCallSpeech.uploadRecording(`/api/calls/${callId}/transcribe`, blob, signal, progress),
        onProgress(stage, percent) {
          if (listening !== input || !canListen()) return;
          statusEl.textContent = stage === 'uploading'
            ? SakiI18n.t('正在上传录音…') + (percent === null ? '' : ` ${percent}%`)
            : SakiI18n.t('正在识别整句话…');
        },
        onText(text) {
          if (listening !== input) return;
          liveTextEl.textContent = text ? SakiI18n.t('实时预览：') + text : '';
        },
        onStatus(status) {
          if (listening !== input || !canListen()) return;
          const labels = {connecting:'正在聆听', listening:'正在聆听', degraded:'实时预览不可用，仍在录音',
            vad_loading:'正在准备自动断句，仍可录音并点击发送', manual:'自动断句暂不可用，请点击发送',
            transcribing:'正在识别整句话…', empty:'未识别到内容，录音已保留，可重试或继续说',
            limit:'本段录音已达上限，请点击发送后继续'};
          statusEl.textContent = SakiI18n.t(labels[status] || '正在聆听');
          sendSpeechBtn.classList.toggle('hidden', status === 'transcribing');
          retrySpeechBtn.classList.toggle('hidden', status !== 'empty');
        },
        onError(error, retryable) {
          if (listening !== input || !canListen()) return;
          statusEl.textContent = SakiI18n.t(retryable ? '识别未完成，录音已保留' : '语音识别连接不稳定');
          liveTextEl.textContent = SakiI18n.t(error.message || '请稍后再说一次');
          sendSpeechBtn.classList.add('hidden'); retrySpeechBtn.classList.remove('hidden');
        },
        onTurn(turn) {
          if (listening !== input || !canListen()) return;
          window.dispatchEvent(new CustomEvent('saki:call-stt-metrics', {detail:turn.metrics}));
          pendingTurn = turn;
          addTurn({id:turn.clientTurnId, role:'user', content:turn.text});
          void sendPendingTurn();
        },
      });
      listening = input;
    }
    retrySpeechBtn.classList.add('hidden');
    await listening.start();
  }
  async function sendPendingTurn() {
    if (!pendingTurn || busy || ending || call?.status !== 'active') return;
    const turn = pendingTurn;
    busy = true; retrySpeechBtn.classList.add('hidden'); sendSpeechBtn.classList.add('hidden');
    liveTextEl.textContent = ''; statusEl.textContent = SakiI18n.t('对方正在回应…');
    const controller = new AbortController(); responseAbort = controller;
    const timeout = setTimeout(() => controller.abort(), 90000);
    try {
      const result = await api(`/api/calls/${callId}/turn`, {
        method:'POST', body:JSON.stringify({text:turn.text, client_turn_id:turn.clientTurnId}), signal:controller.signal,
      });
      clearTimeout(timeout);
      if (ending || call?.status !== 'active') return;
      pendingTurn = null;
      if (result.assistant_turn) addTurn(result.assistant_turn);
      if (ttsEnabled && result.tts_text) {
        statusEl.textContent = SakiI18n.t('对方正在说话…');
        try { await playSpeech(result.tts_text); }
        catch (error) { liveTextEl.textContent = error.message; }
      }
      if (ending || call?.status !== 'active') return;
      if (result.end_after_speech) {
        await api(`/api/calls/${callId}/character-end`, {method:'POST'});
        call.status = 'ended'; call.end_reason = 'character_hangup'; showEnded(call.end_reason); return;
      }
    } catch (error) {
      if (ending || call?.status !== 'active') return;
      statusEl.textContent = SakiI18n.t('回复失败');
      liveTextEl.textContent = error.name === 'AbortError' ? SakiI18n.t('请求超时，请稍后重试。') : error.message;
      retrySpeechBtn.classList.remove('hidden');
    } finally {
      clearTimeout(timeout); if (responseAbort === controller) responseAbort = null;
      busy = false;
      if (canListen()) void startListening();
    }
  }
  sendSpeechBtn.onclick = () => { if (canListen()) void listening?.commitNow(); };
  retrySpeechBtn.onclick = () => {
    retrySpeechBtn.classList.add('hidden');
    if (pendingTurn) void sendPendingTurn();
    else if (listening && canListen()) void listening.retry();
    else void startListening();
  };

  async function playSpeech(text) {
    const controller = new AbortController(); responseAbort = controller;
    const timeout = setTimeout(() => controller.abort(), 30000);
    let blob;
    try {
      const response = await fetch(`/api/calls/${callId}/tts`, {method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'}, body:JSON.stringify({text}), signal:controller.signal});
      if (!response.ok) { const data=await response.json().catch(()=>({})); throw new Error(data.error||'角色语音生成失败'); }
      blob = await response.blob();
    } finally { clearTimeout(timeout); if (responseAbort === controller) responseAbort = null; }
    if (ending || call?.status !== 'active') return;
    const url=URL.createObjectURL(blob), audio=new Audio(url);
    await new Promise(resolve => {
      let done=false;
      const finish=()=>{if(done)return;done=true;clearTimeout(playbackTimeout);audio.pause();URL.revokeObjectURL(url);$('playGate').style.display='none';deferredPlayback=null;activeAudio=null;resolve();};
      const playbackTimeout=setTimeout(finish,120000);
      activeAudio={finish};audio.onended=finish;audio.onerror=finish;
      const play=()=>audio.play().catch(finish);
      audio.play().catch(()=>{deferredPlayback=play;$('playGate').style.display='block';});
    });
  }

  async function beginActive(openingTurn) {
    showActive();
    if(openingTurn?.content){
      addTurn(openingTurn);
      if(ttsEnabled){busy=true;statusEl.textContent=SakiI18n.t('对方正在说话…');try{const tone=openingTurn.tone?`[${openingTurn.tone}]\n`:'';await playSpeech(tone+openingTurn.content)}catch(e){liveTextEl.textContent=e.message}finally{busy=false}}
    }
    if(!muted)startListening();
  }
  async function decideOutgoing() {
    statusEl.textContent=SakiI18n.t('等待对方接听…');
    try { const result=await api(`/api/calls/${callId}/decision`,{method:'POST'}); call=Object.assign(call||{},result.call);
      if(result.decision==='accepted') await beginActive(result.opening_turn);
      else if(result.decision==='rejected'||call.status==='ended') showEnded(call.end_reason||'rejected');
      else if(call.status==='active') beginActive(null);
    } catch(error){ call=error.data?.call||call; showEnded(call?.end_reason||'failed'); liveTextEl.textContent=error.message; }
  }
  async function initialize() {
    try { const data=await api(`/api/calls/${callId}`); call=data.call; ttsEnabled=call.tts_enabled===true; $('name').textContent=call.character.remark||call.character.name; $('avatar').src=call.character.avatar; $('avatar').onerror=()=>{$('avatar').src='/static/avatar_assistant.png'}; renderTurns(call.turns);
      if(call.status==='ended'){showEnded(call.end_reason);return}
      if(call.status==='active'){await beginActive(null);return}
      if(call.initiator==='assistant'){statusEl.textContent=SakiI18n.t('邀请你进行通话');incomingActions.classList.remove('hidden')}
      else decideOutgoing();
    } catch(error){statusEl.textContent=SakiI18n.t('通话加载失败');liveTextEl.textContent=error.message;$('backBtn').classList.remove('hidden')}
  }

  function disableIncomingActions(disabled){$('acceptBtn').disabled=disabled;$('rejectBtn').disabled=disabled}
  $('acceptBtn').onclick=async()=>{
    disableIncomingActions(true);incomingActions.classList.add('hidden');statusEl.textContent=SakiI18n.t('正在接听…');
    try{
      const data=await api(`/api/calls/${callId}/accept`,{method:'POST'});
      call=Object.assign(call||{},data.call);await beginActive(data.opening_turn||null);
      if(data.response_warning)liveTextEl.textContent=data.response_warning;
    }catch(e){incomingActions.classList.remove('hidden');disableIncomingActions(false);liveTextEl.textContent=e.message}
  };
  $('rejectBtn').onclick=async()=>{
    disableIncomingActions(true);incomingActions.classList.add('hidden');statusEl.textContent=SakiI18n.t('正在拒绝…');
    try{
      const data=await api(`/api/calls/${callId}/reject`,{method:'POST'});
      call=data.call;showEnded(call.end_reason);liveTextEl.textContent=data.message||data.response_warning||'';
    }catch(e){incomingActions.classList.remove('hidden');disableIncomingActions(false);liveTextEl.textContent=e.message}
  };
  async function hangupCurrentCall(){
    ending=true;stopListening();responseAbort?.abort();activeAudio?.finish();
    try{const data=await api(`/api/calls/${callId}/end`,{method:'POST'});call=data.call;showEnded(call.end_reason)}
    catch(e){ending=false;liveTextEl.textContent=e.message;if(pendingTurn)retrySpeechBtn.classList.remove('hidden');else void startListening();}
  }
  $('hangupBtn').onclick=hangupCurrentCall;
  $('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').classList.toggle('muted',muted);$('muteLabel').textContent=muted?SakiI18n.t('取消静音'):SakiI18n.t('静音');if(muted){stopListening();if(pendingTurn&&!busy)retrySpeechBtn.classList.remove('hidden');statusEl.textContent=SakiI18n.t('麦克风已关闭')}else{statusEl.textContent=SakiI18n.t('正在通话');startListening()}};
  $('backBtn').onclick=()=>location.href=call?`/chat/${encodeURIComponent(call.char_id)}`:'/';
  $('playGate').onclick=()=>{const play=deferredPlayback;deferredPlayback=null;$('playGate').style.display='none';if(play)play()};
  window.addEventListener('beforeunload',event=>{if(call?.status==='active'){event.preventDefault();event.returnValue=''}});
  window.addEventListener('pagehide',()=>{ending=true;stopListening();responseAbort?.abort();activeAudio?.finish();});
  initialize();
})();
</script>
</body>
</html>

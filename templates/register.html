<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 | Kunigami</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#fff3f8">
  <style>
    body {
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #fff3f8 0%, #ffe9e1 100%);
      margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #444;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 182, 185, 0.2);
      width: 80%; max-width: 340px; text-align: center;
      border: 1px solid #fff;
    }
    .logo {
      width: 80px; height: 80px; border-radius: 50%;
      margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { margin: 0 0 20px; font-size: 18px; color: #d81b60; }
    input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 1px solid #ddd; border-radius: 10px;
      box-sizing: border-box; outline: none; transition: 0.2s;
      font-size: 14px;
    }
    input:focus { border-color: #ffb6b9; background: #fffbfb; }
    button {
      width: 100%; padding: 12px; background: #ffb6b9;
      color: white; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer; font-size: 15px;
      transition: 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,182,185,0.4); }
    .error-msg { color: red; font-size: 12px; margin-bottom: 10px; display: none; }
    .hint-msg { color: #777; font-size: 12px; line-height: 1.5; margin: -4px 0 12px; }
    .legal-consent {
      display: flex; align-items: flex-start; gap: 8px; margin: 2px 0 14px;
      color: #666; font-size: 12px; line-height: 1.6; text-align: left;
    }
    .legal-consent input {
      flex: 0 0 auto; width: 16px; height: 16px; margin: 2px 0 0;
      padding: 0; accent-color: #d81b60; cursor: pointer;
    }
    .legal-consent a { color: #d81b60; font-weight: 600; text-decoration: none; }
    .legal-consent a:hover, .legal-consent a:focus { text-decoration: underline; }
    button:disabled { opacity: 0.65; cursor: not-allowed; transform: none; box-shadow: none; }
    .age-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.28);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      padding: 20px; box-sizing: border-box;
    }
    .age-modal {
      width: 100%; max-width: 320px; background: rgba(255,255,255,0.98);
      border-radius: 16px; padding: 22px; box-shadow: 0 16px 38px rgba(0,0,0,0.18);
      text-align: left; box-sizing: border-box;
    }
    .age-modal-title { font-size: 17px; font-weight: 700; color: #d81b60; margin-bottom: 10px; }
    .age-modal-text { font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 18px; }
    .age-modal-actions { display: flex; gap: 10px; }
    .age-modal-actions button { border-radius: 10px; }
    .age-modal-actions .secondary { background: #eee; color: #666; }
    .switch-link { margin-top: 8px; font-size: 12px; color: #888; }
    .switch-link a { color: #d81b60; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-card">
  <img src="/static/logo.png" class="logo" onerror="this.src='/static/default_avatar.png'">
  <h2>创建新账号</h2>

  <div id="error-msg" class="error-msg"></div>
  <div id="hint-msg" class="hint-msg">本产品仅面向年满18周岁的用户。注册前需要完成年龄确认。</div>

  <input type="email" id="email" name="email" placeholder="邮箱 (Email)">
  <input type="text" id="display_name" name="display_name" placeholder="昵称 / 显示名 (可选)">
  <input type="password" id="password" name="password" placeholder="密码 (Password)">

  <label class="legal-consent" for="legal_accepted">
    <input type="checkbox" id="legal_accepted" name="legal_accepted">
    <span>
      我已阅读并同意
      <a href="{{ legal_documents.terms.path }}" target="_blank" rel="noopener noreferrer">《用户协议》</a>
      和
      <a href="{{ legal_documents.privacy.path }}" target="_blank" rel="noopener noreferrer">《隐私政策》</a>
    </span>
  </label>

  <button id="registerBtn" onclick="doRegister()">注 册</button>

  <div class="switch-link">
    已有账号？<a href="/login">去登录</a>
  </div>
</div>

<div class="age-modal-overlay" id="ageModalOverlay">
  <div class="age-modal">
    <div class="age-modal-title" id="ageModalTitle"></div>
    <div class="age-modal-text" id="ageModalText"></div>
    <div class="age-modal-actions">
      <button type="button" class="secondary" id="ageModalCancel">取消</button>
      <button type="button" id="ageModalConfirm">确认</button>
    </div>
  </div>
</div>

<script>
  const LEGAL_VERSIONS = {{ legal_versions | tojson }};
  let pendingRegisterPayload = null;

  function setError(message) {
    const errorEl = document.getElementById('error-msg');
    errorEl.textContent = message || '';
    errorEl.style.display = message ? 'block' : 'none';
  }

  function setLoading(isLoading, text) {
    const btn = document.getElementById('registerBtn');
    btn.disabled = !!isLoading;
    btn.textContent = text || (isLoading ? '处理中...' : '注 册');
  }

  function showAgeModal(step) {
    const overlay = document.getElementById('ageModalOverlay');
    const title = document.getElementById('ageModalTitle');
    const text = document.getElementById('ageModalText');
    const confirmBtn = document.getElementById('ageModalConfirm');
    const cancelBtn = document.getElementById('ageModalCancel');

    if (step === 1) {
      title.textContent = '年龄确认';
      text.textContent = '本产品仅面向年满18周岁的用户。请确认你是否已经年满18周岁。';
      confirmBtn.textContent = '我已年满18周岁';
      cancelBtn.textContent = '未满18周岁';
      confirmBtn.onclick = () => showAgeModal(2);
    } else {
      title.textContent = '再次确认';
      text.textContent = '请再次确认你已年满18周岁。确认后将使用当前填写的信息创建账号。';
      confirmBtn.textContent = '确认并注册';
      cancelBtn.textContent = '取消';
      confirmBtn.onclick = () => {
        overlay.style.display = 'none';
        submitRegister();
      };
    }

    cancelBtn.onclick = () => {
      overlay.style.display = 'none';
      pendingRegisterPayload = null;
      setLoading(false);
    };
    overlay.style.display = 'flex';
  }

  async function submitRegister() {
    if (!pendingRegisterPayload) return;
    setLoading(true, '正在注册...');
    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          ...pendingRegisterPayload,
          adult_confirmed: true,
          legal_accepted: true,
          terms_version: LEGAL_VERSIONS.terms,
          privacy_version: LEGAL_VERSIONS.privacy
        })
      });
      const result = await res.json();

      if (result.status === 'success') {
        window.location.href = '/';
      } else {
        setError(result.message || '注册失败');
        setLoading(false);
      }
    } catch (e) {
      setError('网络错误');
      setLoading(false);
    } finally {
      pendingRegisterPayload = null;
    }
  }

  async function doRegister() {
    const email = document.getElementById('email').value.trim();
    const displayName = document.getElementById('display_name').value.trim();
    const password = document.getElementById('password').value.trim();
    setError('');

    if (!email || !password) {
      setError('请输入邮箱和密码');
      return;
    }

    if (!document.getElementById('legal_accepted').checked) {
      setError('请先阅读并同意用户协议与隐私政策');
      return;
    }

    pendingRegisterPayload = { email, password, display_name: displayName };
    showAgeModal(1);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doRegister();
  });
</script>

  <!-- AI巡航悬浮球 -->
  <script src="/static/ai-cruise.js"></script>
</body>
</html>

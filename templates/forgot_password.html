<!DOCTYPE html>
<html lang="{{ ui_language }}" data-ai-brand-line="{{ ui_t('ai_brand_line', brand=saki_brand) }}">
<head>
  {% include "ui_language_head.html" %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 | {{ saki_brand }}</title>
  <style>
    body {
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #fff3f8 0%, #ffe9e1 100%);
      margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 72px 0 24px; box-sizing: border-box; color: #444;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 30px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 182, 185, 0.3);
      width: 80%; max-width: 320px; text-align: center;
      border: 1px solid #fff;
    }
    .logo {
      width: 80px; height: 80px; border-radius: 50%;
      margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { margin: 0 0 20px; font-size: 18px; color: #d81b60; }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }

    input {
      width: 100%; padding: 12px;
      border: 1px solid #ddd; border-radius: 10px;
      box-sizing: border-box; outline: none; transition: 0.2s;
      font-size: 14px;
    }
    input:focus { border-color: #ffb6b9; background: #fffbfb; }
    input.error { border-color: red !important; background: #fff5f5; }

    .verify-group {
      display: flex; gap: 8px;
    }
    .btn-send {
      width: 100px; padding: 0; flex-shrink: 0;
      background: #f1f3f5; color: #666; font-size: 12px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%; padding: 12px; background: #ffb6b9;
      color: white; border: none; border-radius: 10px;
      font-weight: bold; cursor: pointer; font-size: 15px;
      transition: 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 182, 185, 0.4); }
    button:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

    .error-msg { color: red; font-size: 12px; margin-bottom: 10px; display: none; }
  </style>
  <link rel="stylesheet" href="/static/auth-layout.css">
</head>
<body class="auth-page">
{% include "ui_language_select.html" %}
{% include "auth_guide_link.html" %}

<div class="login-card">
  <img src="/static/logo.png" class="logo" onerror="this.src='/static/default_avatar.png'">
  <h2>忘记密码</h2>
  <p class="auth-instructions">{{ ui_t('输入账号邮箱，获取验证码，再设置新密码。验证码 10 分钟内有效。') }}</p>

  <div id="error-msg" role="status" aria-live="polite" class="error-msg"></div>

  <div class="input-group">
    <input type="email" id="email" autocomplete="email" aria-label="账号邮箱" placeholder="账号邮箱 (Email)">
  </div>

  <div class="input-group verify-group">
    <input type="text" id="verify_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="验证码" placeholder="验证码">
    <button class="btn-send" id="btn-send" onclick="sendCode()">去发送</button>
  </div>

  <div class="input-group">
    <input type="password" id="new_password" minlength="8" maxlength="256" autocomplete="new-password" aria-label="设置新密码" placeholder="设置新密码 (New Password)">
  </div>

  <button id="btn-submit" onclick="doReset()">确 认</button>

  <div class="auth-account-links">
    <a href="/login">登录账号</a>
  </div>
</div>

<script>
  let countdownTimer, sendView = 0;
  // An SMTP outage is shared, never a lookup of this address or its receipt.
  function watchMailService(view, notice) {
    for (const delay of [2000, 8000, 20000]) setTimeout(async () => {
      if (view !== sendView) return;
      try {
        const res = await fetch('/api/forgot_password/send_code', {cache: 'no-store'});
        if (res.status !== 503 || view !== sendView) return;
        const data = await res.json();
        if (view !== sendView) return;
        ++sendView;
        notice.textContent = data.message || SakiI18n.t('找回密码服务暂时不可用，请稍后重试。');
        notice.style.color = 'red';
        notice.style.display = 'block';
      } catch (_) { /* A lost health probe is not evidence of failed mail. */ }
    }, delay);
  }
  function waitToResend(button, value) {
    const seconds = Math.min(3600, Math.max(1, Number(value) || 60));
    const end = Date.now() + seconds * 1000;
    clearInterval(countdownTimer);
    function draw() {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      button.disabled = left > 0;
      button.textContent = left ? left + 's' : SakiI18n.t('去发送');
      if (!left) clearInterval(countdownTimer);
    }
    countdownTimer = setInterval(draw, 1000);
    draw();
  }

  async function sendCode() {
    const view = ++sendView;
    const emailInput = document.getElementById('email');
    const email = emailInput.value.trim();
    const errorEl = document.getElementById('error-msg');
    const btnSend = document.getElementById('btn-send');

    if(!email || !email.includes('@')) {
      emailInput.classList.add('error');
      errorEl.textContent = SakiI18n.t("请输入有效的邮箱地址");
      errorEl.style.color = 'red';
      errorEl.style.display = 'block';
      return;
    }
    emailInput.classList.remove('error');
    errorEl.style.display = 'none';

    btnSend.disabled = true;
    btnSend.textContent = SakiI18n.t('发送中...');

    try {
      const res = await fetch('/api/forgot_password/send_code', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email })
      });
      const result = await res.json();

      const admitted = res.status === 202 && result.status === 'accepted';
      errorEl.textContent = result.message || SakiI18n.t('找回密码服务暂时不可用，请稍后重试。');
      errorEl.style.color = admitted ? '#444' : 'red';
      errorEl.style.display = 'block';
      if (admitted) watchMailService(view, errorEl);
      if (admitted || res.headers.has('Retry-After')) {
        waitToResend(btnSend, res.headers.get('Retry-After'));
      } else {
        if (result.error_type === 'email') emailInput.classList.add('error');
        btnSend.disabled = false;
        btnSend.textContent = SakiI18n.t('去发送');
      }
    } catch(e) {
      errorEl.textContent = SakiI18n.t("网络错误");
      errorEl.style.color = 'red';
      errorEl.style.display = 'block';
      btnSend.disabled = false;
      btnSend.textContent = SakiI18n.t('去发送');
    }
  }

  async function doReset() {
    ++sendView;
    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('verify_code');
    const passInput = document.getElementById('new_password');
    const errorEl = document.getElementById('error-msg');
    const btnSubmit = document.getElementById('btn-submit');

    const email = emailInput.value.trim();
    const code = codeInput.value.trim();
    const password = passInput.value;

    if(!email || !code || !password) {
      errorEl.textContent = SakiI18n.t("请完整填写所有项");
      errorEl.style.display = 'block';
      return;
    }

    emailInput.classList.remove('error');
    codeInput.classList.remove('error');
    passInput.classList.remove('error');
    errorEl.style.display = 'none';

    btnSubmit.disabled = true;
    btnSubmit.textContent = SakiI18n.t('提交中...');

    try {
      const res = await fetch('/api/forgot_password/reset', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, code, password })
      });
      const result = await res.json();

      if(result.status === 'success') {
        alert(SakiI18n.t("密码重置成功，请重新登录"));
        window.location.href = '/login';
      } else {
        if(result.error_type === 'code') {
          codeInput.classList.add('error');
        } else if(result.error_type === 'password') {
          passInput.classList.add('error');
        } else if(result.error_type === 'email') {
          emailInput.classList.add('error');
        }
        errorEl.textContent = result.message || SakiI18n.t('找回密码服务暂时不可用，请稍后重试。');
        errorEl.style.color = 'red'; // 确保错误提示为红色
        errorEl.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.textContent = SakiI18n.t('确 认');
      }
    } catch(e) {
      errorEl.textContent = SakiI18n.t("网络错误");
      errorEl.style.display = 'block';
      btnSubmit.disabled = false;
      btnSubmit.textContent = SakiI18n.t('确 认');
    }
  }
</script>

  <!-- AI巡航悬浮球 -->
  <script src="/static/ai-cruise.js"></script>
</body>
</html>

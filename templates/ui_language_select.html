<style>
  .saki-language-setting {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    z-index: 50;
    width: 68px;
    height: 34px;
  }
  .saki-language-setting select {
    appearance: none;
    -webkit-appearance: none;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0 27px 0 13px;
    border: 1px solid #eee5e9;
    border-radius: 11px;
    background: #fff;
    color: #675660;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .6px;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(122, 83, 104, .07);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .saki-language-setting select:hover {
    border-color: #dfbdce;
    box-shadow: 0 3px 9px rgba(122, 83, 104, .11);
  }
  .saki-language-setting select:focus-visible {
    outline: 2px solid #dba4bd;
    outline-offset: 3px;
  }
  .saki-language-setting select:disabled {
    cursor: wait;
    opacity: .6;
  }
  .saki-language-setting svg {
    position: absolute;
    top: 12px;
    right: 11px;
    width: 10px;
    height: 10px;
    color: #bb8ba3;
    pointer-events: none;
  }
</style>
<div class="saki-language-setting">
  <select aria-label="{{ ui_t('用户语言') }}" onchange="SakiI18n.setLanguage(this.value,this)">
    <option value="ja" aria-label="日本語" {% if ui_language == 'ja' %}selected{% endif %}>JA</option>
    <option value="en" aria-label="English" {% if ui_language == 'en' %}selected{% endif %}>EN</option>
    <option value="zh-CN" aria-label="简体中文" {% if ui_language == 'zh-CN' %}selected{% endif %}>ZH</option>
  </select>
  <svg viewBox="0 0 10 10" fill="none" aria-hidden="true" focusable="false">
    <path d="m2 3.5 3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

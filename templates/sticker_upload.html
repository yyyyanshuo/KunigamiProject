<!DOCTYPE html>
<html lang="{{ ui_language }}" data-ai-brand-line="{{ ui_t('ai_brand_line', brand=saki_brand) }}">
<head>
  {% include "ui_language_head.html" %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>上传表情包</title>
<script src="/static/theme-loader.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

:root{
--primary-color:#ffb6b9;
--primary-dark:#f09598;
--primary-rgba-light:rgba(255,182,185,.1);
--primary-rgba-lighter:rgba(255,182,185,.15);
--primary-rgba-medium:rgba(255,182,185,.2);
--primary-rgba-strong:rgba(255,182,185,.3);
--primary-rgba-darker:rgba(255,182,185,.5);
--bg-color:linear-gradient(180deg,#fff7f8,#ffeef1);
--text-main:#2c3e50;
--text-muted:#8ca0b3;
--border-color:#edf1f5;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;

background:var(--bg-color);

color:var(--text-main);

padding:18px 16px 90px;
}


/* 顶部 */

.header{

position:relative;
display:flex;
align-items:center;
justify-content:space-between;

margin-bottom:22px;
}

.back-link{

text-decoration:none;

width:36px;height:36px;border-radius:50%;flex-shrink:0;

display:flex;align-items:center;justify-content:center;

background:rgba(255,255,255,.9);

color:var(--text-main);

font-size:17px;

box-shadow:0 2px 8px rgba(0,0,0,.06);

transition:transform .2s ease;
}

.back-link:active{transform:scale(.92);}

.title{

position:absolute;
left:50%;
transform:translateX(-50%);
font-size:17px;

font-weight:700;

color:var(--text-main);
}


/* 卡片 */

.card{

background:rgba(255,255,255,0.85);

border-radius:16px;

padding:18px 16px;

margin-bottom:16px;

backdrop-filter:blur(10px);

box-shadow:0 2px 8px rgba(0,0,0,0.05);
}


/* label */

.label{

font-size:13px;

font-weight:600;

color:var(--text-muted);

margin-bottom:8px;

display:block;
}


/* 输入 */

.input{

width:100%;

padding:11px 12px;

border-radius:10px;

border:1px solid var(--border-color);

font-size:14px;

background:#fff;

outline:none;

transition:border-color .2s ease, box-shadow .2s ease;
}

.input:focus{

border-color:var(--primary-color);

box-shadow:0 0 0 3px var(--primary-rgba-lighter);
}


/* 文件 */

.file{

width:100%;

padding:10px;

border-radius:10px;

border:1.5px dashed var(--primary-rgba-darker);

background:#fff;

font-size:13px;

color:var(--text-muted);
}

/* 原生文件按钮胶囊化 */

input[type="file"]::file-selector-button{

border:none;

border-radius:999px;

padding:7px 14px;

margin-right:10px;

background:var(--primary-rgba-lighter);

color:var(--primary-dark);

font-size:13px;

font-weight:600;

cursor:pointer;

font-family:inherit;
}


/* 表情列表 */

#stickerRows{

margin-top:10px;
}


/* 单个表情 */

.sticker-row{

display:flex;

align-items:center;

gap:10px;

padding:10px;

margin-bottom:10px;

background:#fff;

border:1px solid var(--border-color);

border-radius:12px;

box-shadow:0 2px 6px rgba(0,0,0,0.04);
}


/* 表情文件 */

.sticker-file{

flex:0 0 120px;
}


/* 表情描述下拉 */

.sticker-name{

flex:1;

padding:8px 10px;

border-radius:8px;

border:1px solid var(--border-color);

font-size:13px;

background:#fff;

min-width:0;

outline:none;
}


/* 删除按钮 */

.btn-del{

flex-shrink:0;

border:none;

background:#fff0f2;

color:#d9305c;

border-radius:999px;

padding:6px 12px;

cursor:pointer;

font-size:13px;

font-weight:600;
}


/* 添加按钮 */

.btn-add-row{

width:100%;

padding:12px;

margin-top:8px;

border-radius:999px;

border:1.5px dashed var(--primary-rgba-darker);

background:#fff;

color:var(--primary-dark);

font-size:14px;

font-weight:600;

cursor:pointer;

transition:background .2s ease;
}

.btn-add-row:hover{

background:var(--primary-rgba-light);
}


/* 上传按钮 */

.btn-submit{

position:fixed;

bottom:16px;

left:16px;

right:16px;

border:none;

border-radius:999px;

padding:15px;

font-size:16px;

font-weight:700;

color:#fff;

background:linear-gradient(135deg,var(--primary-color),var(--primary-dark));

box-shadow:0 6px 20px var(--primary-rgba-dark, rgba(255,140,160,0.4));

cursor:pointer;
}

.btn-submit:disabled{

opacity:0.6;

box-shadow:none;
}

</style>
</head>


<body>


<div class="header">

<a href="javascript:history.back()" class="back-link" aria-label="返回">←</a>

<div class="title">上传表情包</div>

<div style="width:36px;flex-shrink:0"></div>

</div>

<p class="privacy-note" role="note" style="font-size:12px;color:var(--text-muted);line-height:1.6;background:rgba(255,255,255,0.75);border:1px solid var(--border-color);border-radius:12px;padding:10px 12px;margin:0 0 16px;">{{ ui_t('此表情包将向其他登录用户公开，并可被保存。请确认图片和名称适合公开。') }}</p>


<form id="uploadForm">


<div class="card">

<label class="label">表情包名称</label>

<input class="input" type="text" id="packName" name="name" placeholder="输入表情包名称" required>

</div>



<div class="card">

<label class="label">封面图</label>

<input class="file" type="file" id="cover" name="cover" accept="image/png,image/jpeg,image/gif,image/webp" required>

</div>



<div class="card">

<label class="label">表情列表</label>

<div id="stickerRows"></div>

<button type="button" id="btnAddRow" class="btn-add-row">＋ 添加一个表情</button>

</div>


<button id="btnSubmit" class="btn-submit" type="submit">

上传表情包

</button>


</form>



<script>

(function(){

const stickerRows=document.getElementById('stickerRows');

const btnAddRow=document.getElementById('btnAddRow');

let rowIndex=0;

let allowedDescriptions=[];



function buildSelectName(i){

var html='<select class="sticker-name" name="sticker_name_'+i+SakiI18n.fragment('" required><option value="">请选择描述</option>');

var list=Array.isArray(allowedDescriptions)?allowedDescriptions:[];

for(var j=0;j<list.length;j++){

var d=String(list[j]);

var val=d.replace(/&/g,'&amp;').replace(/"/g,'&quot;');

var text=d.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

html+='<option value="'+val+'">'+text+'</option>';

}

html+='</select>';

return html;

}



function addRow(){

const i=rowIndex++;

const div=document.createElement('div');

div.className='sticker-row';

div.innerHTML=

'<input class="sticker-file" type="file" name="sticker_'+i+'" accept="image/png,image/jpeg,image/gif,image/webp" required>'+

buildSelectName(i)+

SakiI18n.fragment('<button type="button" class="btn-del">删除</button>');

div.querySelector('.btn-del').onclick=function(){

div.remove();

};

stickerRows.appendChild(div);

}



function initThenAddRows(){

fetch('/api/stickers/allowed_descriptions')

.then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })

.then(function(list){

allowedDescriptions=Array.isArray(list)?list:[];

if(allowedDescriptions.length===0) allowedDescriptions=['开心','捂脸','爱心','难过','害羞','点赞','happy','love'];

btnAddRow.onclick=addRow;

addRow();

addRow();

})

.catch(function(){

allowedDescriptions=['开心','捂脸','爱心','难过','害羞','点赞','happy','love'];

btnAddRow.onclick=addRow;

addRow();

addRow();

});

}



initThenAddRows();



document.getElementById('uploadForm').onsubmit=async function(e){

e.preventDefault();



const btn=document.getElementById('btnSubmit');



const name=document.getElementById('packName').value.trim();

const cover=document.getElementById('cover').files[0];



if(!name){

alert(SakiI18n.t('请填写表情包名称'));

return;

}



if(!cover){

alert(SakiI18n.t('请选择封面图'));

return;

}



const fileInputs=stickerRows.querySelectorAll('input[type="file"]');

let hasFile=false;



fileInputs.forEach(function(inp){

if(inp.files && inp.files[0]) hasFile=true;

});



if(!hasFile){

alert(SakiI18n.t('请至少添加一个表情'));

return;

}



if(!confirm(SakiI18n.t("此表情包将向其他登录用户公开，并可被保存。请确认图片和名称适合公开。"))) return;
btn.disabled=true;

btn.textContent=SakiI18n.t('上传中…');



const fd=new FormData();



fd.append('name',name);

fd.append('cover',cover);



let idx=0;



let descError=false;

stickerRows.querySelectorAll('.sticker-row').forEach(function(row){

const fileInput=row.querySelector('input[type="file"]');

const nameSelect=row.querySelector('select.sticker-name');

if(fileInput.files && fileInput.files[0]){

const desc=(nameSelect && nameSelect.value)?nameSelect.value.trim():'';

if(!desc){ descError=true; }

}

});

if(descError){

alert(SakiI18n.t('请为每个表情选择描述'));

btn.disabled=false;

btn.textContent=SakiI18n.t('上传表情包');

return;

}

stickerRows.querySelectorAll('.sticker-row').forEach(function(row){

const fileInput=row.querySelector('input[type="file"]');

const nameSelect=row.querySelector('select.sticker-name');

if(fileInput.files && fileInput.files[0]){

fd.append('sticker_'+idx,fileInput.files[0]);

fd.append('sticker_name_'+idx,(nameSelect && nameSelect.value)?nameSelect.value.trim():'');

idx++;

}

});



try{

const r=await fetch('/api/stickers/packs/upload',{method:'POST',body:fd});

const data=await r.json();



if(data.status==='success' && data.pack_id){

window.location.href='/stickers/pack/'+encodeURIComponent(data.pack_id);

return;

}



alert(data.message || SakiI18n.t('上传失败'));

}catch(err){

alert(SakiI18n.t('上传失败'));

}



btn.disabled=false;

btn.textContent=SakiI18n.t('上传表情包');

};



})();

</script>


  <!-- AI巡航悬浮球 -->
  <script src="/static/ai-cruise.js"></script>
</body>
</html>

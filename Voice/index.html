<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Test - ElevenLabs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TTS 测试</h1>
        <div class="upload-section">
            <input type="password" id="apiKey" autocomplete="off" placeholder="输入你自己的 ElevenLabs API Key">
            <input type="text" id="voiceId" value="fs5rJCTrpRvrfFP8YYoB" placeholder="输入 voice_id">
            <textarea id="ttsText" rows="4" placeholder="输入要转换的文字..." style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; resize: vertical; font-family: inherit;">你好，很高兴认识你。</textarea>
            <button id="ttsBtn" onclick="testTTS()">生成语音</button>
            <audio id="ttsAudio" controls style="display: none; width: 100%; margin-top: 1rem;"></audio>
        </div>
    </div>

    <script>
        async function testTTS() {
            const apiKey = document.getElementById("apiKey").value;
            const voiceId = document.getElementById("voiceId").value;
            const text = document.getElementById("ttsText").value;
            const btn = document.getElementById("ttsBtn");
            const audioEl = document.getElementById("ttsAudio");

            if (!apiKey || !voiceId || !text) {
                alert("请先填写你自己的 API Key、Voice ID 和要转换的文本！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "生成中...";

            try {
                const response = await fetch("/tts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        voice_id: voiceId,
                        text: text
                    })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const audioUrl = window.URL.createObjectURL(blob);
                    
                    audioEl.src = audioUrl;
                    audioEl.style.display = "block";
                    audioEl.play();
                } else {
                    alert("语音生成失败: " + response.statusText);
                }
            } catch (error) {
                alert("请求出错: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "生成语音";
            }
        }
    </script>
</body>
</html>
